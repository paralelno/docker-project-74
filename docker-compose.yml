services:
  app:
    image: paralelnodev/docker-project-74
    build:
      context: .
      dockerfile: Dockerfile.production
    working_dir: /app
    environment:
      - CI=true
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=db
      - DATABASE_NAME=postgres
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=***
      - DATABASE_PORT=5432
    command: make test
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "***"
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
